name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npx --no-install playwright install --with-deps --no-shell chromium
      - run: npm run smoke:chrome
      - run: npm run lint:firefox
      - run: python scripts/check_ascii.py
      - uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: artifacts/*.zip
